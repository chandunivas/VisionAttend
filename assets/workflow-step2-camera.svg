<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentBtn2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="url(#bgGrad2)" rx="16"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="960" height="64" fill="#0b0f19" opacity="0.8"/>
  <circle cx="48" cy="32" r="14" fill="#4f46e5"/>
  <path d="M42 32 L46 36 L54 28" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="74" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18">VisionAttend</text>
  <rect x="200" y="20" width="120" height="24" rx="12" fill="#1e1b4b"/>
  <text x="260" y="36" fill="#818cf8" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">LIVE VERIFICATION</text>

  <!-- Header Banner -->
  <g transform="translate(48, 86)">
    <rect width="190" height="26" rx="6" fill="#4f46e5" opacity="0.2"/>
    <text x="12" y="18" fill="#818cf8" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">STEP 2: SCAN &amp; CAPTURE</text>
    <text x="0" y="52" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="22">Webcam Biometric Feed &amp; GPS Proximity Check</text>
  </g>

  <!-- Left: Live Camera Viewfinder Box -->
  <g transform="translate(48, 160)" filter="url(#shadow2)">
    <!-- Container -->
    <rect width="520" height="340" rx="20" fill="#030712" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Viewfinder Inner Glass Area -->
    <rect x="12" y="12" width="496" height="316" rx="14" fill="#0f172a"/>

    <!-- Simulated Face Silhouette in Viewfinder -->
    <ellipse cx="260" cy="150" rx="64" ry="82" fill="#1e293b" stroke="#6366f1" stroke-dasharray="8 6" stroke-width="2.5"/>
    <ellipse cx="260" cy="130" rx="36" ry="46" fill="#334155" opacity="0.8"/>
    <path d="M225 210 Q260 250 295 210" fill="none" stroke="#6366f1" stroke-width="2"/>

    <!-- Reticle Corner Markers -->
    <path d="M150 70 L130 70 L130 90" stroke="#818cf8" stroke-width="3" fill="none"/>
    <path d="M370 70 L390 70 L390 90" stroke="#818cf8" stroke-width="3" fill="none"/>
    <path d="M150 250 L130 250 L130 230" stroke="#818cf8" stroke-width="3" fill="none"/>
    <path d="M370 250 L390 250 L390 230" stroke="#818cf8" stroke-width="3" fill="none"/>

    <!-- Real-time Live Badge -->
    <rect x="28" y="28" width="92" height="24" rx="12" fill="#dc2626"/>
    <circle cx="42" cy="40" r="4" fill="#ffffff"/>
    <text x="54" y="44" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="11">CAMERA ON</text>

    <!-- Face Guidance Overlay -->
    <rect x="140" y="278" width="240" height="30" rx="15" fill="#0b0f19" opacity="0.85" stroke="#334155"/>
    <text x="260" y="297" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Position face inside oval reticle</text>
  </g>

  <!-- Right: GPS Triangulation & Security Checklist -->
  <g transform="translate(592, 160)" filter="url(#shadow2)">
    <!-- Container -->
    <rect width="320" height="340" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <text x="24" y="36" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="15">GPS Geofence Status</text>
    
    <!-- GPS Coordinates Card -->
    <rect x="24" y="52" width="272" height="74" rx="12" fill="#0f172a" stroke="#334155"/>
    <circle cx="46" cy="78" r="10" fill="#10b981" opacity="0.2"/>
    <circle cx="46" cy="78" r="4" fill="#10b981"/>
    <text x="68" y="74" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="700">17.38504° N, 78.48667° E</text>
    <text x="68" y="94" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">Accuracy: ±4.8m (Satellite Lock)</text>
    <text x="68" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10">Calculated Distance: 12.4m from center</text>

    <!-- Boundary Status -->
    <rect x="24" y="136" width="272" height="42" rx="10" fill="#064e3b" stroke="#047857"/>
    <text x="40" y="162" fill="#a7f3d0" font-family="sans-serif" font-weight="700" font-size="12">✓ Within 100m Allowed Geofence</text>

    <!-- Demo Bypass Indicator -->
    <g transform="translate(24, 190)">
      <rect width="272" height="36" rx="8" fill="#451a03" stroke="#b45309" stroke-dasharray="3 3"/>
      <rect x="10" y="11" width="14" height="14" rx="3" fill="#f59e0b"/>
      <path d="M12 18 L15 21 L21 14" stroke="#000000" stroke-width="2" fill="none"/>
      <text x="32" y="23" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="600">Demo Mode: Geofence bypass active</text>
    </g>

    <!-- Capture Button -->
    <g transform="translate(24, 252)">
      <rect width="272" height="52" rx="12" fill="url(#accentBtn2)"/>
      <circle cx="56" cy="26" r="12" fill="#ffffff" opacity="0.2"/>
      <path d="M52 26 L55 29 L61 22" stroke="#ffffff" stroke-width="2.5" fill="none"/>
      <text x="146" y="31" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13" text-anchor="middle">Verify GPS &amp; Check-In</text>
    </g>
  </g>
</svg>
