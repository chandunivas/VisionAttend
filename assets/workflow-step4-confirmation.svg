<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad4)" rx="16"/>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="960" height="64" fill="#0b0f19" opacity="0.8"/>
  <circle cx="48" cy="32" r="14" fill="#4f46e5"/>
  <path d="M42 32 L46 36 L54 28" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="74" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18">VisionAttend</text>
  <rect x="200" y="20" width="130" height="24" rx="12" fill="#065f46"/>
  <text x="265" y="36" fill="#6ee7b7" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">RECORD COMMITTED</text>

  <!-- Step Header -->
  <g transform="translate(48, 86)">
    <rect width="210" height="26" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="12" y="18" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1">STEP 4: FIRESTORE COMMIT</text>
    <text x="0" y="52" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="22">Attendance Confirmed &amp; Log Synchronized</text>
  </g>

  <!-- Left: Big Success Confirmation Card -->
  <g transform="translate(48, 160)" filter="url(#shadow4)">
    <rect width="520" height="340" rx="20" fill="url(#successGrad)" stroke="#059669" stroke-width="1.5"/>

    <!-- Success Checkmark Ring -->
    <circle cx="260" cy="72" r="36" fill="#10b981" stroke="#34d399" stroke-width="3"/>
    <path d="M246 72 L256 82 L276 60" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="260" y="132" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="20" text-anchor="middle">Attendance Successfully Marked!</text>
    <text x="260" y="154" fill="#a7f3d0" font-family="sans-serif" font-size="13" text-anchor="middle">Verified on Oct 18, 2026 at 10:48 AM</text>

    <!-- Details Box Inside Card -->
    <rect x="36" y="174" width="448" height="136" rx="14" fill="#022c22" stroke="#047857"/>

    <g transform="translate(60, 200)">
      <!-- Line 1 -->
      <text x="0" y="14" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600">Student Name:</text>
      <text x="140" y="14" fill="#ffffff" font-family="sans-serif" font-size="12">Aarav Sharma (CS-2023-041)</text>

      <!-- Line 2 -->
      <text x="0" y="40" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600">Subject / Session:</text>
      <text x="140" y="40" fill="#ffffff" font-family="sans-serif" font-size="12">CS401 · Neural Networks</text>

      <!-- Line 3 -->
      <text x="0" y="66" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600">Biometric Match:</text>
      <text x="140" y="66" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">91% (Pass &gt;= 75%)</text>

      <!-- Line 4 -->
      <text x="0" y="92" fill="#6ee7b7" font-family="sans-serif" font-size="12" font-weight="600">Proximity Lock:</text>
      <text x="140" y="92" fill="#38bdf8" font-family="sans-serif" font-size="12">12.5m from Geofence Center (Valid)</text>
    </g>
  </g>

  <!-- Right: Updated Status & Monthly Calendar Preview -->
  <g transform="translate(592, 160)" filter="url(#shadow4)">
    <rect width="320" height="340" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <text x="24" y="34" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="15">Today's Status Badge</text>

    <!-- Large PRESENT Badge -->
    <g transform="translate(24, 48)">
      <rect width="272" height="52" rx="12" fill="#065f46" stroke="#10b981"/>
      <circle cx="48" cy="26" r="10" fill="#10b981"/>
      <path d="M44 26 L47 29 L53 23" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="70" y="31" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="800">STATUS: PRESENT</text>
    </g>

    <!-- Calendar Month Snapshot -->
    <text x="24" y="132" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">October 2026 Attendance Grid</text>

    <g transform="translate(24, 146)">
      <!-- Day Grid 5x4 -->
      <!-- Row 1 -->
      <rect x="0" y="0" width="34" height="28" rx="6" fill="#065f46"/><text x="17" y="18" fill="#34d399" font-size="11" text-anchor="middle">1</text>
      <rect x="42" y="0" width="34" height="28" rx="6" fill="#065f46"/><text x="59" y="18" fill="#34d399" font-size="11" text-anchor="middle">2</text>
      <rect x="84" y="0" width="34" height="28" rx="6" fill="#065f46"/><text x="101" y="18" fill="#34d399" font-size="11" text-anchor="middle">3</text>
      <rect x="126" y="0" width="34" height="28" rx="6" fill="#7f1d1d"/><text x="143" y="18" fill="#f87171" font-size="11" text-anchor="middle">4</text>
      <rect x="168" y="0" width="34" height="28" rx="6" fill="#065f46"/><text x="185" y="18" fill="#34d399" font-size="11" text-anchor="middle">5</text>
      <rect x="210" y="0" width="34" height="28" rx="6" fill="#0f172a"/><text x="227" y="18" fill="#64748b" font-size="11" text-anchor="middle">6</text>

      <!-- Row 2 -->
      <rect x="0" y="34" width="34" height="28" rx="6" fill="#065f46"/><text x="17" y="52" fill="#34d399" font-size="11" text-anchor="middle">7</text>
      <rect x="42" y="34" width="34" height="28" rx="6" fill="#065f46"/><text x="59" y="52" fill="#34d399" font-size="11" text-anchor="middle">8</text>
      <rect x="84" y="34" width="34" height="28" rx="6" fill="#065f46"/><text x="101" y="52" fill="#34d399" font-size="11" text-anchor="middle">9</text>
      <rect x="126" y="34" width="34" height="28" rx="6" fill="#065f46"/><text x="143" y="52" fill="#34d399" font-size="11" text-anchor="middle">10</text>
      <rect x="168" y="34" width="34" height="28" rx="6" fill="#065f46"/><text x="185" y="52" fill="#34d399" font-size="11" text-anchor="middle">11</text>
      <rect x="210" y="34" width="34" height="28" rx="6" fill="#0f172a"/><text x="227" y="52" fill="#64748b" font-size="11" text-anchor="middle">12</text>

      <!-- Row 3 (Today highlighted) -->
      <rect x="0" y="68" width="34" height="28" rx="6" fill="#065f46"/><text x="17" y="86" fill="#34d399" font-size="11" text-anchor="middle">13</text>
      <rect x="42" y="68" width="34" height="28" rx="6" fill="#065f46"/><text x="59" y="86" fill="#34d399" font-size="11" text-anchor="middle">14</text>
      <rect x="84" y="68" width="34" height="28" rx="6" fill="#065f46"/><text x="101" y="86" fill="#34d399" font-size="11" text-anchor="middle">15</text>
      <rect x="126" y="68" width="34" height="28" rx="6" fill="#065f46"/><text x="143" y="86" fill="#34d399" font-size="11" text-anchor="middle">16</text>
      <rect x="168" y="68" width="34" height="28" rx="6" fill="#065f46"/><text x="185" y="86" fill="#34d399" font-size="11" text-anchor="middle">17</text>
      <!-- TODAY -->
      <rect x="210" y="68" width="34" height="28" rx="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/><text x="227" y="86" fill="#064e3b" font-weight="900" font-size="11" text-anchor="middle">18</text>
    </g>

    <!-- Legend -->
    <g transform="translate(24, 280)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="16" y="10" fill="#cbd5e1" font-size="11">Present</text>

      <circle cx="86" cy="6" r="4" fill="#ef4444"/>
      <text x="96" y="10" fill="#cbd5e1" font-size="11">Absent</text>

      <circle cx="166" cy="6" r="4" fill="#64748b"/>
      <text x="176" y="10" fill="#cbd5e1" font-size="11">Weekend/Off</text>
    </g>
  </g>
</svg>
